services:
  # Front de produção: build estático servido pelo nginx, que também repassa /api ao backend.
  # Sem porta publicada: o Nginx Proxy Manager alcança o container pela rede dele (proxy).
  gomoney-web:
    container_name: gomoney-web
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: ../configs/docker/node/Dockerfile.deploy
    volumes:
      - ./configs/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gomoney-network
      - proxy
    depends_on:
      - gomoney-api

  gomoney-api:
    container_name: gomoney-api
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: ../configs/docker/go/Dockerfile.deploy
    # O cliente do TigerBeetle usa io_uring, que o perfil padrão de segurança do Docker bloqueia.
    security_opt:
      - seccomp=unconfined
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@gomoney-postgres:5432/${POSTGRES_DB}
      TB_ADDRESSES: gomoney-tigerbeetle:3000
      TB_CLUSTER_ID: "0"
      TZ: America/Sao_Paulo
    networks:
      - gomoney-network
    depends_on:
      gomoney-postgres:
        condition: service_healthy
      gomoney-tigerbeetle:
        condition: service_started

  gomoney-postgres:
    container_name: gomoney-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - gomoney-postgres-data:/var/lib/postgresql/data
    networks:
      - gomoney-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  gomoney-tigerbeetle:
    container_name: gomoney-tigerbeetle
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    restart: unless-stopped
    # Réplica única com --development: suficiente para a demonstração. Um ambiente
    # de produção de verdade rodaria um cluster de 6 réplicas sem essa flag.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ ! -f /data/0_0.tigerbeetle ]; then
          /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 --development /data/0_0.tigerbeetle
        fi
        exec /tigerbeetle start --addresses=0.0.0.0:3000 --development /data/0_0.tigerbeetle
    security_opt:
      - seccomp=unconfined
    cap_add:
      - IPC_LOCK
    volumes:
      - gomoney-tigerbeetle-data:/data
    networks:
      - gomoney-network

networks:
  gomoney-network:
    name: gomoney-network
    driver: bridge
  proxy:
    name: ${PROXY_NETWORK:-nginx-proxy-manager}
    external: true

volumes:
  gomoney-postgres-data:
    name: gomoney-postgres-data
  gomoney-tigerbeetle-data:
    name: gomoney-tigerbeetle-data
