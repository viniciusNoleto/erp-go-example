server {
  listen 80;
  root /usr/share/nginx/html;

  # Exportação estática do Next: cada rota é um arquivo .html (/sales -> sales.html).
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;

  # Arquivos com hash no nome: podem ficar em cache para sempre.
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /api/ {
    proxy_pass http://razonete-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Necessário para o Server-Sent Events: sem buffer e sem timeout curto.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
}
