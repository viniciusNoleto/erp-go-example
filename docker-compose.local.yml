services:
  # Front em modo desenvolvimento: Next (next dev) com hot reload. O ./frontend inteiro é montado
  # no container (node_modules incluso, instalado pelo `make install-deps`), então o
  # editor e as ferramentas do host enxergam as mesmas dependências.
  razonete-web:
    container_name: razonete-web
    user: node
    restart: unless-stopped
    tty: true
    environment:
      # O next dev repassa /api para o backend pela rede do compose (ver next.config.ts).
      API_URL: http://razonete-api:8080
      NEXT_TELEMETRY_DISABLED: "1"
    build:
      context: ./frontend
      dockerfile: ../configs/docker/node/Dockerfile.local
    volumes:
      - ./frontend/:/app/
    ports:
      - ${APP_PORT:-5180}:5173
    networks:
      - razonete-network
    depends_on:
      - razonete-api

  razonete-api:
    container_name: razonete-api
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: ../configs/docker/go/Dockerfile.deploy
    # O cliente do TigerBeetle usa io_uring, que o perfil padrão de segurança do Docker bloqueia.
    security_opt:
      - seccomp=unconfined
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@razonete-postgres:5432/${POSTGRES_DB}
      TB_ADDRESSES: razonete-tigerbeetle:3000
      TB_CLUSTER_ID: "0"
      TZ: America/Sao_Paulo
    ports:
      - ${API_PORT:-8088}:8080
    networks:
      - razonete-network
    depends_on:
      razonete-postgres:
        condition: service_healthy
      razonete-tigerbeetle:
        condition: service_started

  razonete-postgres:
    container_name: razonete-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - ${POSTGRES_HOST_PORT:-5433}:5432
    volumes:
      - razonete-postgres-data:/var/lib/postgresql/data
    networks:
      - razonete-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  razonete-tigerbeetle:
    container_name: razonete-tigerbeetle
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    restart: unless-stopped
    # O arquivo de dados precisa ser "formatado" uma vez antes do primeiro start.
    # --development relaxa exigências de hardware (Direct I/O, memória) para
    # rodar em notebook; em produção roda-se um cluster de 6 réplicas sem ela.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ ! -f /data/0_0.tigerbeetle ]; then
          /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 --development /data/0_0.tigerbeetle
        fi
        exec /tigerbeetle start --addresses=0.0.0.0:3000 --development /data/0_0.tigerbeetle
    # O TigerBeetle usa io_uring, que o perfil padrão de segurança do Docker bloqueia.
    security_opt:
      - seccomp=unconfined
    cap_add:
      - IPC_LOCK
    volumes:
      - razonete-tigerbeetle-data:/data
    ports:
      - ${TIGERBEETLE_HOST_PORT:-3001}:3000
    networks:
      - razonete-network

networks:
  razonete-network:
    name: razonete-network
    driver: bridge

volumes:
  razonete-postgres-data:
    name: razonete-postgres-data
  razonete-tigerbeetle-data:
    name: razonete-tigerbeetle-data
