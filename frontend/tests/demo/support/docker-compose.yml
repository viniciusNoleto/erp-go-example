# Stack só do vídeo de apresentação: API, Postgres e TigerBeetle num projeto do compose à parte
# (gomoney-demo), sem volumes e sem nomes fixos de container. Não encosta nos dados do `make up`:
# cada gravação sobe tudo do zero, a API carrega a loja de demonstração e o teardown apaga.
#
# Usado por global-setup.ts / global-teardown.ts; a API fica no host em DEMO_API_PORT (8099).
name: gomoney-demo

services:
  api:
    build:
      context: ../../../../backend
      dockerfile: ../configs/docker/go/Dockerfile.deploy
    # O cliente do TigerBeetle usa io_uring, que o perfil padrão de segurança do Docker bloqueia.
    security_opt:
      - seccomp=unconfined
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://demo:demo@postgres:5432/demo
      TB_ADDRESSES: tigerbeetle:3000
      TB_CLUSTER_ID: "0"
      TZ: America/Sao_Paulo
    ports:
      - ${DEMO_API_PORT:-8099}:8080
    depends_on:
      postgres:
        condition: service_healthy
      tigerbeetle:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 2s
      timeout: 3s
      retries: 20

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    entrypoint:
      - sh
      - -c
      - |
        set -e
        /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 --development /data/0_0.tigerbeetle
        exec /tigerbeetle start --addresses=0.0.0.0:3000 --development /data/0_0.tigerbeetle
    security_opt:
      - seccomp=unconfined
    cap_add:
      - IPC_LOCK
    tmpfs:
      - /data
